<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Gradient border -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="21" fill="none"
        stroke="url(#g)" stroke-width="2" opacity="0.45"/>

  <!-- Inner subtle highlight top-left -->
  <rect x="3" y="3" width="94" height="46" rx="19"
        fill="url(#g)" opacity="0.04"/>

  <!-- Letter R — geometric path -->
  <!-- Stem (vertical bar) -->
  <rect x="24" y="22" width="10" height="56" rx="3" fill="url(#g)" filter="url(#glow)"/>

  <!-- Top bowl bump -->
  <!-- Arch top -->
  <path d="M34 22 Q62 22 62 38 Q62 54 34 54" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Leg (diagonal) -->
  <line x1="34" y1="54" x2="66" y2="78" stroke="url(#g)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
</svg>
